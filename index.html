const schedule = weekends.map(w => ({...w, days:getDays(w.id)}));

function minutes(time) {
  const m = time.split(':').map(Number);
  return m[0] * 60 + m[1];
}
function range(time) { return time.split('–').map(s => s.trim()); }

const monthNumbers = { 'października':9, 'listopada':10, 'grudnia':11, 'stycznia':0, 'lutego':1 };
function weekendStart(dateText) {
  const [day, month] = dateText.split('–')[0].trim().split(' ');
  const year = monthNumbers[month] < 6 ? 2027 : 2026;
  return new Date(year, monthNumbers[month], Number(day), 0, 0, 0, 0);
}
function weekendActive(dateText, now = new Date()) {
  const start = weekendStart(dateText), end = new Date(start);
  end.setDate(start.getDate()+2);
  return now >= start && now < end;
}
function classActive(dateText, day, time, now = new Date()) {
  if (!weekendActive(dateText, now)) return false;
  const start = weekendStart(dateText);
  const dayDate = new Date(start);
  if (day === 'Niedziela') dayDate.setDate(start.getDate()+1);
  const [from,to] = range(time).map(minutes);
  const a = new Date(dayDate); a.setHours(Math.floor(from/60),from%60,0,0);
  const b = new Date(dayDate); b.setHours(Math.floor(to/60),to%60,0,0);
  return now >= a && now < b;
}

function iconArrow(dir) {
  return dir === 'left'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>';
}

function iconTheme(dark) {
  return dark 
    ? '<span class="theme-icon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>'
    : '<span class="theme-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>';
}

function withBreaks(classes) {
  const sorted = [...classes].sort((a,b)=>minutes(range(a.time)[0])-minutes(range(b.time)[0]));
  return sorted.flatMap((x,i)=>{
    const next=sorted[i+1];
    if(!next) return [x];
    const gap=minutes(range(next.time)[0])-minutes(range(x.time)[1]);
    return gap >= 30 ? [x,{type:'break',time:`${range(x.time)[1]} – ${range(next.time)[0]}`}] : [x];
  });
}

function renderClass(x, id, day, dateText) {
  const active = classActive(dateText, day, x.time);
  const sundayLecture = day === 'Niedziela' && x.subject !== 'Psychologia pracy';
  const saturdayExercise = day === 'Sobota';
  const sundayWork = day === 'Niedziela' && x.subject === 'Psychologia pracy';

  return `<article class="class-card ${x.color}${active ? ' is-active' : ''}">
    <time>${x.time}</time>
    <div class="class-info">
      <div class="class-title-row">
        <div class="class-title">
          <h4>${active ? '<span class="active-dot" aria-label="Trwa teraz"></span>' : ''}${x.subject}</h4>
          ${sundayLecture ? '<span class="lecture-badge" data-tooltip="Wykład" aria-label="Wykład">W</span>' : ''}
          ${saturdayExercise ? '<span class="exercise-badge session-badge" data-tooltip="Ćwiczenia" aria-label="Ćwiczenia">ĆW</span>' : ''}
          ${sundayWork ? '<span class="exercise-badge session-badge" data-tooltip="Konwersatorium" aria-label="Konwersatorium">KW</span>' : ''}
          <span class="session-badge ${saturdayExercise || sundayWork ? 'exercise-session' : ''}" aria-label="Spotkanie ${x.sessionNumber} z ${x.totalSessions}">${x.sessionNumber}/${x.totalSessions}</span>
        </div>
      </div>
      <p>${x.teacher}</p>
    </div>
    ${sundayLecture || sundayWork ? '<button type="button" class="teams-button" data-tooltip="Dostępne wkrótce" aria-label="Otwórz Teams"><img src="./Microsoft_Teams.png" width="20" height="20" alt="Microsoft Teams"><span>Otwórz Teams</span></button>' : ''}
  </article>`;
}

function renderDay(day, id, dateText) {
  const classes = day.classes;
  const content = classes.length
    ? `<div class="class-list">${withBreaks(classes).map(x => x.type === 'break'
        ? `<article class="break-card"><time>${x.time}</time><div class="break-info"><strong>Przerwa</strong></div><div class="break-content-mobile"><h4>Przerwa</h4></div></article>`
        : renderClass(x, id, day.day, dateText)).join('')}</div>`
    : `<p class="empty-day-message">Brak zajęć w ten dzień</p>`;
  const activeDay = classes.some(x => classActive(dateText, day.day, x.time));
  return `<section class="day-section">
    <div class="day-toggle"><strong>${activeDay ? '<span class="active-dot" aria-label="Trwa teraz"></span>' : ''}${day.day}</strong></div>
    <div class="day-content">${content}</div>
  </section>`;
}

let currentColumn=0;
const scheduleEl = document.getElementById('schedule');
let scrollTimer = null;
function buildScheduleMarkup() {
  return schedule.map((w,i)=>{
    const active=weekendActive(w.date);
    const days=w.days.length
      ? `<div class="weekend-content">${w.days.map(d=>renderDay(d,w.id,w.date)).join('')}</div>`
      : `<div class="empty-state">Szczegóły zajęć zostaną dodane wkrótce.</div>`;
    return `<section class="weekend-card${w.id===1?' is-nearest':''}${i===currentColumn?' is-main':''}" data-index="${i}">
      <div class="weekend-toggle">
        <button type="button" class="column-arrow column-arrow-left" aria-label="Poprzedni zjazd" data-column="${i-1}" ${i===0?'disabled':''}>${iconArrow('left')}</button>
        <div class="weekend-heading"><strong>${active?'<span class="active-dot" aria-label="Trwa teraz"></span>':''}Zjazd ${w.id}</strong><span>${w.date}</span></div>
        <button type="button" class="column-arrow column-arrow-right" aria-label="Następny zjazd" data-column="${i+1}" ${i===schedule.length-1?'disabled':''}>${iconArrow('right')}</button>
      </div>${days}
    </section>`;
  }).join('');
}

function updateOpacity(list) {
  const cards = [...list.children];
  if (!cards.length) return;
  const viewportCenter = list.scrollLeft + list.clientWidth / 2;
  const fadeDistance = Math.max(list.clientWidth * 0.66, cards[0].offsetWidth * 0.95);
  cards.forEach((card) => {
    const cardCenter = card.offsetLeft + card.offsetWidth / 2;
    const distance = Math.abs(cardCenter - viewportCenter);
    const progress = Math.max(0, 1 - distance / fadeDistance);
    const opacity = 0.25 + 0.75 * progress;
    card.style.setProperty('--card-opacity', opacity.toFixed(3));
  });
}

function updateMainColumn(nextIndex) {
  currentColumn=Math.max(0,Math.min(schedule.length-1,nextIndex));
  [...scheduleEl.children].forEach((card,i)=>{
    card.classList.toggle('is-main', i===currentColumn);
    const left=card.querySelector('.column-arrow-left');
    const right=card.querySelector('.column-arrow-right');
    if(left) left.disabled = i===0;
    if(right) right.disabled = i===scheduleEl.children.length-1;
  });
  updateOpacity(scheduleEl);
}

function render() {
  scheduleEl.innerHTML=buildScheduleMarkup();
  updateMainColumn(currentColumn);
  updateOpacity(scheduleEl);
}

function nearestColumn(list) {
  const cards=[...list.children];
  if(!cards.length)return 0;
  const center=list.scrollLeft + list.clientWidth/2;
  return cards.reduce((best,c,i)=>Math.abs((c.offsetLeft+c.offsetWidth/2)-center)<Math.abs((cards[best].offsetLeft+cards[best].offsetWidth/2)-center)?i:best,0);
}

function scrollColumn(i) {
  const index=Math.max(0,Math.min(schedule.length-1,i));
  const target=scheduleEl.children[index];
  if(!target)return;
  updateMainColumn(index);
  scheduleEl.scrollTo({left:target.offsetLeft,behavior:'smooth'});
}

function selectColumn(i){ scrollColumn(i); }

scheduleEl.addEventListener('click', e=>{
  const arrow=e.target.closest('.column-arrow');
  if(arrow){ e.preventDefault(); e.stopPropagation(); if(!arrow.disabled) scrollColumn(Number(arrow.dataset.column)); return; }
  const card=e.target.closest('.weekend-card');
  if(card && !drag.moved) scrollColumn(Number(card.dataset.index));
});

scheduleEl.addEventListener('scroll',()=>{
  updateOpacity(scheduleEl);
  const index = nearestColumn(scheduleEl);
  if (index !== currentColumn) updateMainColumn(index);
});
window.addEventListener('resize',()=>{ updateOpacity(scheduleEl); updateMainColumn(nearestColumn(scheduleEl)); });

let drag={active:false,moved:false,startX:0,startScroll:0};
scheduleEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||e.target.closest('button'))return;
  drag={active:true,moved:false,startX:e.clientX,startScroll:scheduleEl.scrollLeft};
  scheduleEl.setPointerCapture(e.pointerId);
});
scheduleEl.addEventListener('pointermove',e=>{
  if(!drag.active)return;
  const dx=e.clientX-drag.startX;
  if(Math.abs(dx)>4)drag.moved=true;
  scheduleEl.scrollLeft=drag.startScroll-dx;
});
function endDrag(e){
  if(!drag.active)return;
  drag.active=false;
  try{scheduleEl.releasePointerCapture(e.pointerId)}catch(_){ }
  if(!drag.moved)return;
  scrollColumn(nearestColumn(scheduleEl));
}
scheduleEl.addEventListener('pointerup',endDrag);
scheduleEl.addEventListener('pointercancel',endDrag);

function setTheme(dark, save = false) {
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
  if(save) {
    localStorage.setItem('schedule-theme',dark?'dark':'light');
  }
  const b=document.getElementById('themeToggle');
  b.setAttribute('aria-label',dark?'Włącz jasny motyw':'Włącz ciemny motyw');
  b.setAttribute('aria-pressed',dark?'true':'false');
  const thumb = b.querySelector('.theme-toggle-thumb');
  thumb.classList.toggle('is-dark', dark);
  thumb.innerHTML=iconTheme(dark);
}

const saved=localStorage.getItem('schedule-theme');
const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

if(saved) {
  setTheme(saved === 'dark', false);
} else {
  setTheme(darkModeMediaQuery.matches, false);
}

darkModeMediaQuery.addEventListener('change', (e) => {
  if(!localStorage.getItem('schedule-theme')) {
    setTheme(e.matches, false);
  }
});

document.getElementById('themeToggle').addEventListener('click',()=>{
  const isDark = document.documentElement.dataset.theme !== 'dark';
  setTheme(isDark, true);
});

document.getElementById('favoriteButton').addEventListener('click',()=>{
  alert('Aby dodać stronę do ulubionych, użyj skrótu Ctrl+D (Windows/Linux) lub ⌘+D (Mac).');
});

render();
