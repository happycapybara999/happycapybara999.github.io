const FB={"🍽️":["1–1,5 h","Propozycja obiadu zaplanowana w trasie. W Hiszpanii obiad je się zwykle po 14:00, a kolację po 20:30, więc poza tymi porami część lokali ma mniejsze menu albo jest zamknięta.","Sprawdź godziny i menu w Mapach Google, a w święto 12.10 i w weekend rozważ rezerwację stolika."],

const DET={
"Ermita de San Antonio de la Florida Madrid":["30–45 min","Niewielka kaplica z końca XVIII wieku, zbudowana na zlecenie <a class='ext-link' href='https://pl.wikipedia.org/wiki/Karol_IV_Burbon' target='_blank'>Karol IV<span class='mi'>open_in_new</span></a>. Jej wnętrze pokrywa kopuła ze freskami <a class='ext-link' href='https://pl.wikipedia.org/wiki/Francisco_Goya' target='_blank'>Francisco Goya<span class='mi'>open_in_new</span></a>, uznawana za jedno z najważniejszych dzieł artysty. Goya przedstawił cud świętego Antoniego z Padwy, ale postaci ustawił na balustradzie jak na prawdziwym tarasie, wśród ludzi z ówczesnego <a class='ext-link' href='https://pl.wikipedia.org/wiki/Madryt' target='_blank'>Madrytu<span class='mi'>open_in_new</span></a>. W kaplicy spoczywa także sam malarz. Obok stoi bliźniacza kaplica, w której odprawia się nabożeństwa.<br><br>Franciszek Goya, jeden z najwybitniejszych malarzy przełomu XVIII i XIX wieku, stworzył w tej kaplicy dzieło totalne, które do dziś zachwyca świeżością formy oraz niesamowitą dynamiką kompozycji. Zamiast tradycyjnego, statycznego ujęcia scen religijnych, artysta przeniósł biblijne i cudowne wydarzenia w realia współczesnego mu życia ulicznego w stolica Hiszpanii. Postaci wchodzące w skład kompozycji nie przypominają dostojnych, oderwanych od rzeczywistości świętych – są to zwykli ludzie, mieszczanie, a także postacie z marginesu społecznego, ubrane w barwne stroje typowe dla madryckiej ludności tamtej epoki. Zabieg ten sprawił, że widz ma wrażenie uczestnictwa w żywym spektaklu rozgrywającym się tuż nad jego głową. Kopuła kaplicy została zaprojektowana w taki sposób, aby optycznie powiększyć przestrzeń wnętrza i wciągnąć oglądającego w samo centrum wydarzeń. Warto zwrócić uwagę na kunsztowne operowanie światłem i cieniem, a także na niezwykłą swobodę pociągnięć pędzla, która wyprzedzała epokę romantyzmu i zapowiadała narodziny nowoczesnego malarstwa. Świątynia ta pełni obecnie funkcję muzealną, a zarazem jest miejscem spoczynku wybitnego twórcy, którego szczątki sprowadzono tutaj z Bordeaux w 1919 roku. Oprócz samej kopuły warto dokładnie przyjrzeć się detalom architektonicznym oraz wystrojowi wnętrza, które przetrwało liczne burzliwe dzieje hiszpańskiej historii, w tym zawieruchy wojen domowych. Wizyta w tym miejscu pozwala w pełni zrozumieć geniusz Goi i jego głęboki humanizm, objawiający się w empatii do zwykłego człowieka. Planując wizytę, pamiętaj o sprawdzeniu oficjalnych godzin otwarcia oraz możliwości dojazdu komunikacją miejską lub <a class='ext-link' href='https://www.google.com/maps' target='_blank'>Mapy Google<span class='mi'>map</span></a>. To unikalny punkt na kulturalnej mapie Hiszpanii, który doskonale uzupełnia wielkie kolekcje malarstwa zgromadzone w pobliskich muzeach narodowych."],
"Templo de Debod Madrid":["45–60 min","Starożytna egipska świątynia poświęcona Amonowi i Izydzie, zbudowana ok. II w. p.n.e. na południu Egiptu. W latach 60. XX wieku budowa tamy asuańskiej groziła jej zalaniem, więc Egipt podarował ją Hiszpanii w podziękowanie za pomoc w ratowaniu zabytków Nubii. Świątynię rozebrano kamień po kamieniu i odbudowano w parku. Dziś to jedno z najpopularniejszych miejsc, z którego ogląda się zachód słońca nad Madrytem, a wieczorem jej sylwetka odbija się w sadzawkach.","Najpiękniej wygląda o zachodzie słońca. Wejście do środka bywa ograniczone, więc sprawdź godziny."],
"Plaza de Cánovas del Castillo Madrid":["30–60 min","Plac z fontanną Neptuna z XVIII wieku, przy Paseo del Prado, w pobliżu Prado i hotelu Palace. 12 października to Święto Narodowe Hiszpanii (Fiesta Nacional), obchodzone paradą wojskową i uroczystościami z udziałem rodziny królewskiej.","Główna trasa parady zwykle prowadzi Paseo de la Castellana, więc w dniu wyjazdu sprawdź w lokalnych mediach, gdzie dokładnie odbywają się uroczystości. Część ulic jest zamknięta, a dojazd bywa utrudniony."],
"Real Jardín Botánico Madrid":["1–1,5 h","Ogród botaniczny założony z inicjatywy Karola III, w obecnym miejscu przy Prado od 1781 roku. Rośnie tu kilka tysięcy gatunków roślin, rozmieszczonych na tarasach. Są też szklarnie i kolekcja bonsai. Ogród jest cichym, zielonym kontrastem dla pobliskich muzeów.","Godziny według planu: 10:00–19:00, w święto mogą być zmienione."],
"Parque del Retiro Madrid":["1,5–2 h","Największy park w centrum Madrytu, dawniej ogrody królewskie, dostępne dla wszystkich od końca XIX wieku. Wraz z Paseo del Prado wpisano go na listę UNESCO. Do najważniejszych miejsc należą staw z pomnikiem Alfonsa XII, gdzie można wypożyczyć łódkę, szklany Palacio de Cristal, Palacio de Velázquez, ogród różany La Rosaleda i aleja posągów królów.","W niedzielę i święta jest tłoczno, a przy stawie grają uliczni muzycy."],
"Círculo de Bellas Artes Madrid":["45–60 min","Modernistyczny budynek z 1926 roku, dzieło Antonia Palaciosa, siedziba klubu artystycznego. Na szczycie jest taras (azotea) z widokiem na dachy Madrytu, Gran Vía, Cibeles i okolice Pałacu Królewskiego. Alternatywą jest taras Palacio de Cibeles, dawnej poczty głównej.","Idź przed zachodem słońca. Z planu: bilet 3–6 EUR, 16:00–21:00."],
"Estación de Atocha Madrid":["30–45 min","Największy dworzec Madrytu. W zabytkowej hali z XIX wieku rośnie tropikalny ogród z kilkoma tysiącami roślin i żółwiami w stawie. Z nowszej części odjeżdżają pociągi dużych prędkości AVE, a na pobliskiej stacji metra Estación del Arte łatwo się przesiąść.","Kup bilet do Toledo z wyprzedzeniem. Przed peronem jest kontrola bagażu."],
"Catedral de Toledo":["1,5–2 h","Jedna z najważniejszych gotyckich katedr Hiszpanii, budowana od 1226 roku przez około 250 lat. Wnętrze to skarbiec: ołtarz główny, bogato rzeźbiony chór, kaplice, kapitularz i skarbiec z monstrancją Enrique de Arfe. Za ołtarzem znajduje się barokowy Transparente, w którym otwór w sklepieniu wpuszcza światło.","Weź audioprzewodnik. Godziny według planu: 10:00–18:30."],
"Alcázar de Toledo":["45–60 min","Potężna twierdza górująca nad miastem, odbudowana po zniszczeniach z wojny domowej, w której była oblegana w 1936 roku. Mieści dziś Muzeum Armii. Z tarasów rozciąga się widok na miasto i rzekę Tag.","W planie to spacer, więc możesz obejrzeć budynek z zewnątrz, a wejście do muzeum traktować jako opcję."],
"Plaza de Zocodover Toledo":["20–30 min","Główny plac starego Toledo, od wieków miejsce targów i spotkań. Stąd odchodzą uliczki do katedry i Alcázaru. To dobry przystanek na kawę i na zakup marcepanu (mazapán), regionalnego przysmaku.","Marcepan kupuj w cukierniach, a nie w pierwszych sklepikach z pamiątkami."],
"Monasterio de San Juan de los Reyes Toledo":["45 min","Klasztor franciszkański z końca XV wieku, ufundowany przez Izabelę Kastylijską i Ferdynanda Aragońskiego. Wyróżnia się ozdobnym krużgankiem w stylu izabelińskim. Na fasadzie wiszą łańcuchy uwolnionych jeńców chrześcijańskich.","Bilet 4 EUR według planu."],
"Sinagoga de Santa María la Blanca Toledo":["20–30 min","Dawna synagoga z XII–XIII wieku w stylu mudejar. We wnętrzu białe łuki podkowiaste spoczywają na ośmiobocznych filarach, co przypomina meczet. Z czasem budynek stał się kościołem. To pamiątka po okresie, gdy w Toledo obok siebie żyli chrześcijanie, muzułmanie i Żydzi.","Bilet 4 EUR według planu. Wnętrze jest małe, więc wystarczy krótka wizyta."],
"Estación de tren de Toledo":["15 min","Dworzec w stylu neomudejar z początku XX wieku, ozdobiony płytkami i łukami. Stąd odjeżdża pociąg z powrotem do Madrytu.","Miej bilet powrotny w telefonie i bądź na stacji z zapasem czasu."],
"Jardines de Sabatini Madrid":["30 min","Neoklasyczne ogrody przy Pałacu Królewskim, urządzone w latach 30. XX wieku na miejscu dawnych stajni. Symetryczne żywopłoty, fontanna i posągi królów dają piękny widok na fasadę pałacu. Wejście jest bezpłatne.","O poranku jest tu spokojnie i dobre światło do zdjęć."],
"Catedral de la Almudena Madrid":["45 min","Katedra konsekrowana w 1993 roku przez Jana Pawła II, budowana około 110 lat. Fasada nawiązuje do baroku, wnętrze do neogotyku, a krypta jest neoromańska. Nowoczesne zdobienia sklepienia dodają jej niezwykłego charakteru.","Bilet 1 EUR według planu. Katedra stoi naprzeciw Pałacu Królewskiego."],
"Real Basílica de San Francisco el Grande Madrid":["30–45 min","Bazylika z XVIII wieku z jedną z największych kopuł w Hiszpanii, o średnicy ok. 33 m. W kaplicach wiszą obrazy m.in. Goi i Zurbarána. Wnętrze jest kameralne i spokojne, w przeciwieństwie do tłoczniejszych miejsc.","Bilet 6 EUR według planu."],
"Palacio Real de Madrid":["2–2,5 h","Oficjalna rezydencja królów Hiszpanii, choć rodzina królewska mieszka gdzie indziej. Pałac z XVIII wieku ma ponad 3 000 pomieszczeń, a dla zwiedzających udostępniono kilkadziesiąt. Warto zobaczyć Salę Tronową, Salę Porcelany i Zbrojownię Królewską. W Galerii Królewskich Kolekcji oglądasz skarby zgromadzone przez hiszpańskich monarchów.","Kup bilet online, żeby uniknąć kolejki. Duże plecaki trzeba zostawić w depozycie."],
"Plaza Mayor Madrid":["45 min","Reprezentacyjny plac z XVII wieku, otoczony trzypiętrowymi kamienicami. Fasadę Casa de la Panadería zdobią freski, a pośrodku stoi pomnik Filipa III. Plac był sceną koronacji, igrzysk i egzekucji. Niedaleko leży Puerta del Sol z tablicą Kilometr Zero, posągiem niedźwiedzia i drzewa truskawkowego oraz zegarem, pod którym Hiszpanie jedzą winogrona w sylwestra.","Kawa na Plaza Mayor jest droższa niż w bocznych ulicach, np. przy Calle Cava Baja."],
"Gran Vía Madrid":["45 min","Najsłynniejsza ulica Madrytu, otwarta w pierwszej połowie XX wieku. Zabudowana okazałymi gmachami w stylu art déco i eklektycznym, z teatrami, kinami i sklepami. Na jej początku stoi budynek Metropolis ze skrzydlatą rzeźbą na kopule.","Wieczorem ulica jest podświetlona i bardzo ruchliwa. Uważaj na kieszonkowców."],
"Museo Nacional Centro de Arte Reina Sofía Madrid":["3 h","Muzeum sztuki XX wieku i współczesnej w dawnym szpitalu. Najsłynniejsze dzieło to Guernica Pabla Picassa, olbrzymi obraz z 1937 roku o bombardowaniu miasta w czasie wojny domowej. Znajdziesz też prace Salvadora Dalí, Joana Miró i Juana Gris.","Zacznij od Guernicy, bo później tłok jest większy. W jej sali nie wolno fotografować. Sprawdź bezpłatne godziny wejścia."],
"Museo Nacional del Prado Madrid":["3–4 h","Jedno z najważniejszych muzeów sztuki na świecie, otwarte w 1819 roku. Zbiory obejmują malarstwo hiszpańskie, flamandzkie i włoskie. Najważniejsze obrazy to Las Meninas Velázqueza, Ogród rozkoszy ziemskich Boscha oraz Maja ubrana i Maja naga Goi, a także Trzeci maja 1808 w Madrycie.","Nie próbuj zobaczyć wszystkiego. Wybierz 8–10 dzieł i obejrzyj je spokojnie."],
"Museo Cerralbo Madrid":["1 h","Muzeum w dawnym pałacu markiza de Cerralbo, który zgromadził kolekcję sztuki i zostawił ją państwu. Wnętrza z końca XIX wieku zachowały się niemal bez zmian, z salą balową, biblioteką i galeriami obrazów. To okazja, by poczuć atmosferę arystokratycznej rezydencji.","Z planu: 3 EUR, 09:30–15:00."]};
const LONG={
"Parque del Retiro Madrid":[
"<strong>Historia.</strong> Retiro powstał w XVII wieku jako królewski kompleks rekreacyjny Buen Retiro, zbudowany za Filipa IV. Znajdowały się tu pałac, teatr, sadzawki i ogrody, a po dawnej świetności zostały m.in. Casón del Buen Retiro i Salón de Reinos. W 1868 roku park przeszedł na własność miasta i od tej pory jest otwarty dla wszystkich. Zajmuje około 120 hektarów, więc jest największym parkiem w centrum Madrytu. W 2021 roku razem z Paseo del Prado trafił na listę UNESCO.",
"<strong>Staw i pomnik Alfonsa XII.</strong> Sercem parku jest Estanque Grande, duży staw, wokół którego stoi monumentalna kolumnada z pomnikiem konnym Alfonsa XII. Można tu wypożyczyć łódkę i popływać, a na schodach przed kolumnadą siedzą ludzie, słuchają muzyków ulicznych i odpoczywają. To dobre miejsce na początek spaceru.",
"<strong>Palacio de Cristal i Palacio de Velázquez.</strong> Szklany pałac z końca XIX wieku, zbudowany na wystawę Filipin, stoi nad małym stawem i wygląda wyjątkowo o każdej porze dnia. W pobliżu jest Palacio de Velázquez, w którym często organizuje się wystawy sztuki. Warto wejść do środka, jeśli jest otwarte, albo po prostu obejść oba budynki dookoła.",
"<strong>Anioł i róże.</strong> W parku stoi Fuente del Ángel Caído, jeden z nielicznych w Europie pomników przedstawiających Lucyfera po upadku z nieba. W maju i czerwcu kwitnie ogród różany La Rosaleda. Jesienią zobaczysz za to piękne kolory liści, a aleja Paseo de las Estatuas zaprowadzi Cię wzdłuż posągów dawnych władców.",
"<strong>Jak to zaplanować.</strong> Retiro odwiedzasz dwa razy: w poniedziałek po wizycie w ogrodzie botanicznym i w środę przed Gran Vía. Za pierwszym razem obejdź staw i Palacio de Velázquez, a za drugim zajrzyj do Palacio de Cristal i do Anioła Upadłego. W niedzielę i święta jest tłoczno, więc najlepiej przyjść rano albo pod wieczór. Weź wodę i zostaw sobie około dwóch godzin."],
"Templo de Debod Madrid":[
"<strong>Egipska świątynia w Madrycie.</strong> Templo de Debod powstała ok. II wieku p.n.e., kiedy król Adijalamani z Meroe zaczął budować świątynię poświęconą Amonowi i Izydzie w Nubii, na południu Egiptu. Później rozbudowali ją władcy z dynastii Ptolemeuszy oraz rzymscy cesarze, m.in. August i Tyberiusz. Dziś w murach można zobaczyć reliefy z wizerunkami bogów.",
"<strong>Dar dla Hiszpanii.</strong> W latach 60. XX wieku budowa tamy asuańskiej groziła zalaniem wielu zabytków Nubii. Hiszpania pomogła w akcji ratunkowej, więc w 1968 roku Egipt podarował jej świątynię w podziękowaniu. Rozebrano ją na bloki, przewieziono statkiem i złożono na nowo w parku, a w 1972 roku otwarto dla zwiedzających. Wcześniej, w latach wojny domowej, stał tu koszarowy Cuartel de la Montaña, zniszczony w 1936 roku.",
"<strong>Zachód słońca.</strong> Świątynia stoi na wzgórzu w Parque del Oeste. Z jej tarasu widać Casę de Campo i w pogodne dni pasmo gór Sierra de Guadarrama. O zachodzie słońca kamienne bramy odbijają się w sadzawkach, a w pobliżu zbierają się mieszkańcy. To jedno z najbardziej klimatycznych miejsc w Madrycie.",
"<strong>Parque del Oeste i okolica.</strong> W parku, na którego skraju stoi Debod, znajdziesz ogród różany La Rosaleda, spacerowe aleje i Paseo del Pintor Rosales z kawiarniami. W okolicy leżą Plaza de España z pomnikiem Cervantesa i Edificio España. Z Parque del Oeste odjeżdża też kolejka linowa do Casa de Campo.",
"<strong>Jak to zaplanować.</strong> W niedzielę 11.10 zaglądasz tu o 18:30, więc zdążysz na zachód słońca. W piątek 16.10 wracasz na spacer przed wyjazdem na lotnisko. Wejście do środka bywa ograniczone, a w poniedziałki świątynia jest zwykle zamknięta, więc sprawdź godziny. Sam teren i taras są dostępne bezpłatnie."],
"Plaza Mayor Madrid":[
"<strong>Plaza Mayor.</strong> Plac zaprojektował Juan Gómez de Mora, a wzniesiono go w latach 1617–1619 za Filipa III. Przez wieki odbywały się tu targi, igrzyska, koronacje i procesy inkwizycji. Kilka razy trawiły go pożary, a po tym z 1790 roku odbudował go Juan de Villanueva, nadając mu obecny, zamknięty kształt z arkadami i trzypiętrowymi kamienicami.",
"<strong>Co zobaczyć na placu.</strong> Najbardziej wyróżnia się Casa de la Panadería z freskami na fasadzie, które pochodzą z końca XX wieku. Pośrodku stoi pomnik konny Filipa III, a na rogu Arco de Cuchilleros prowadzi do ulicy Cava Baja, znanej z tawern i tapas. W pobliżu leży Mercado de San Miguel, dawna hala targowa z żelaznej konstrukcji.",
"<strong>Puerta del Sol.</strong> Kilka minut od placu leży Puerta del Sol, najsłynniejszy plac Madrytu i punkt zerowy sieci dróg Hiszpanii (Kilometr Zero). Zobacz posąg niedźwiedzia sięgającego po owoce drzewa truskawkowego, który jest symbolem miasta, oraz zegar na Casa de Correos. Pod nim w sylwestra Hiszpanie zjadają dwanaście winogron na szczęście. Na dachu widać też neon Tío Pepe.",
"<strong>Jak to zaplanować.</strong> W środę o 14:30 masz tu półgodzinny spacer. Zajrzyj na Plaza Mayor, potem przejdź uliczkami do Sol. Jeśli chcesz zjeść coś na szybko, spróbuj bocadillo de calamares, czyli bułki z kalmarami. Ceny w kawiarniach na samym placu są wyższe niż w bocznych ulicach. Uważaj na kieszonkowców, bo w tej okolicy jest tłoczno."],
"Museo Nacional del Prado Madrid":[
"<strong>Dlaczego to miejsce jest tak ważne.</strong> Prado to jedno z najwybitniejszych muzeów sztuki na świecie. Jego siłą nie jest liczba obrazów, ale ich jakość: ma największą kolekcję dzieł Velázqueza i Goi, ogromne zbiory Tycjana i Rubensa oraz arcydzieła Boscha i El Greca. Zbiory wciąż pochodzą głównie z kolekcji królewskich, zbieranych przez Habsburgów i Burbonów, dlatego pokazują sztukę tak, jak widzieli ją monarchowie. Przygotuj się, że nie zobaczysz wszystkiego. W Prado są tysiące obrazów, a wystawiona jest tylko ich część. Warto więc wybrać najważniejsze i obejrzeć je spokojnie.",
"<strong>Historia muzeum.</strong> Budynek zaprojektował w 1785 roku Juan de Villanueva dla Karola III. Miał mieścić gabinet historii naturalnej i akademię nauk, ale budowę przerwała wojna z Napoleonem. Francuzi urządzili tu zaplecze wojskowe, a gmach mocno ucierpiał. Po wojnie, z inicjatywy królowej Marii Izabeli de Braganza, urządzono w nim muzeum, które otwarto 19 listopada 1819 roku jako Królewskie Muzeum Malarstwa i Rzeźby. Pierwotnie pokazywano około trzystu obrazów. W XIX wieku kolekcja rosła o dary i zakupy, a po wojnie domowej oraz w latach 90. XX wieku przejęła jeszcze zbiory innych instytucji. W 2007 roku Rafael Moneo dobudował nowe skrzydło, które łączy się z kreuzgangiem pobliskiego kościoła Jerónimos.",
"<strong>Budynek i wejścia.</strong> Neoklasyczny gmach Villanuevy ma proste, wydłużone sale i wysokie okna, a obrazy wiszą w kolejności szkół narodowych. Jest kilka wejść, m.in. Puerta de Velázquez, Puerta de Goya i Puerta de Murillo. Zanim ustawisz się w kolejce, sprawdź, które jest dziś najmniej oblegane. Przy wejściu zostaw plecak i płaszcz w szatni, weź plan muzeum i, jeśli lubisz, audioprzewodnik. Z reguły w sali obowiązuje zakaz robienia zdjęć, więc skup się na oglądaniu.",
"<strong>Velázquez, malarz króla.</strong> Diego Velázquez był nadwornym malarzem Filipa IV i jego obrazy tworzą serce muzeum. Las Meninas z 1656 roku (zwykle sala 12) to jedno z najbardziej zagadkowych dzieł w historii malarstwa. Na pierwszym planie stoi infantka Małgorzata, wokół niej dwórki, karły Mari Bárbola i Nicolasa Pertusato oraz pies. Po lewej stoi sam malarz przy ogromnym płótnie, a w lustrze w głębi widać odbicie króla i królowej. Nie wiadomo do końca, kogo właściwie maluje artysta, i na tym polega magia obrazu. Obok zobaczysz Poddanie Bredy z 1635 roku, w którym zwycięzca nie triumfuje, lecz wyciąga rękę do pokonanego, oraz portrety króla i jego rodziny.",
"<strong>Goya, od jasnych kartonów do mroku.</strong> Francisco Goya jest drugim bohaterem Prado. Zacznij od gobelinowych kartonów z pogodnymi scenami z życia Madrytu, potem przejdź do Rodziny Karola IV, w której malarz subtelnie i ironicznie ukazał królewskie postacie. Zobacz razem Maję ubraną i Maję nagą, a także dwa obrazy o powstaniu 1808 roku: Dos de Mayo i Trzeci maja, namalowane w 1814 roku, z mężczyzną w białej koszuli stojącym przed plutonem egzekucyjnym. Na koniec zejdź do Czarnych obrazów (zwykle sala 67). Goya namalował je na ścianach swojego domu Quinta del Sordo około 1820 roku. Pokazują Saturna pożerającego swego syna i inne mroczne wizje, które na zawsze zmieniły malarstwo.",
"<strong>Bosch, Bruegel i Flamandowie.</strong> Hieronymus Bosch jest w Prado szczególnie dobrze reprezentowany, bo Filip II zbierał jego dzieła z pasją. Ogród rozkoszy ziemskich (zwykle sala 56A) to trójdzielny ołtarz: po lewej raj, w środku nagie postacie pośród fantastycznych owoców i ptaków, po prawej piekło. Można go oglądać godzinami i wciąż odkrywać nowe szczegóły. Obok warto zobaczyć Wóz siana i Siedem grzechów głównych. Dalej wiszą Triumf śmierci Pietera Bruegla Starszego, Zdjęcie z krzyża Rogiera van der Weydena z około 1435 roku, Trzy Gracje Rubensa oraz Adam i Ewa Albrechta Dürera.",
"<strong>Włosi, El Greco i hiszpańscy mistrzowie.</strong> Tycjan malował dla Karola V i Filipa II, więc w Prado jest portret cesarza po bitwie pod Mühlbergiem oraz mitologiczne poezje, takie jak Wenus i Adonis. Fra Angelico zostawił tu piękne Zwiastowanie, a Rafael i Tintoretto uzupełniają włoski panteon. El Greco, który mieszkał w Toledo, jest reprezentowany m.in. przez Szlachcica z ręką na piersi, więc po wtorkowej wycieczce zobaczysz ten sam świat z innej perspektywy. Nie pomiń Murilla z jego Niepokalanym Poczęciem, Zurbarána i Ribery.",
"<strong>Ciekawostki, które warto znać.</strong> Przed budynkiem stoi pomnik Velázqueza. Prado jest częścią Paseo del Arte, czyli Złotego Trójkąta Sztuki, który tworzą razem z nim Reina Sofía i muzeum Thyssen-Bornemisza, a Twoja trasa przechodzi przez dwa z trzech. W czasie hiszpańskiej wojny domowej obrazy z Prado ewakuowano z Madrytu w obawie przed bombardowaniami, a po wojnie wróciły na swoje miejsce. Do dziś żadna sala nie pokazuje wszystkiego, więc dyrekcja co jakiś czas zmienia ekspozycję i wypożycza dzieła, dlatego numery sal mogą się różnić od moich.",
"<strong>Obrazy, których nie warto pominąć.</strong> Jeśli czas Cię goni, zobacz przynajmniej te osiem: Las Meninas i Poddanie Bredy Velázqueza, Trzeci maja 1808 i Maję nagą Goi, Ogród rozkoszy ziemskich Boscha, Triumf śmierci Bruegla, Karola V pod Mühlbergiem Tycjana oraz Szlachcica z ręką na piersi El Greca. Do tego dodaj Czarne obrazy Goi, bo niczego podobnego nie znajdziesz w innym muzeum. Kiedy już zobaczysz te dzieła, resztę czasu poświęć na to, co Cię zaciekawi, bo muzeum tej wielkości nagradza ciekawość bardziej niż pośpiech.",
"<strong>Jak oglądać obrazy.</strong> Przy każdym wielkim dziele zatrzymaj się na trzy minuty. Najpierw spójrz na całość z odległości kilku kroków, potem podejdź bliżej i szukaj szczegółów: gestów, spojrzeń, światła i tego, co dzieje się w tle. Przeczytaj krótką tabliczkę, ale nie zaczynaj od niej. Dzięki temu Las Meninas i Ogród rozkoszy ziemskich zapamiętasz dużo dłużej niż po szybkim przejściu obok.",
"<strong>Propozycja czterogodzinnej trasy (14:00–18:00).</strong> Wejdź i zostaw rzeczy do 14:20. Do 15:15 obejrzyj Velázqueza i dwór Filipa IV. Do 16:00 poświęć czas Goi: gobeliny, Rodzina Karola IV, obie Maje, Dos de Mayo i Trzeci maja. O 16:00 zrób przerwę na kawę. Do 16:45 oglądaj Boscha i Flamandów. Do 17:30 zobacz Włochów i El Greca, a na koniec zejdź do Czarnych obrazów, które zrobią wrażenie przed wyjściem. Kolejność możesz zmienić zależnie od tłumów, ale nie zostawiaj Velázqueza i Goi na ostatnie minuty.",
"<strong>Praktyka.</strong> Muzeum jest otwarte zwykle od 10:00 do 20:00, w niedziele i święta krócej. Z moich informacji w ostatnich dwóch godzinach dnia wstęp bywa bezpłatny, ale kolejki są wtedy duże, więc sprawdź aktualne godziny na stronie muzeum. Kup bilet online, żeby wejść szybciej. W budynku są kawiarnia, sklep i toalety, a do wyjścia na Paseo del Prado masz blisko do parku Retiro. Jeśli poczujesz zmęczenie, usiądź na ławce, bo bez przerw łatwo się wypalić."],
"Palacio Real de Madrid":[
"<strong>Historia.</strong> Dawny Alcázar, rezydencja królów Hiszpanii od średniowiecza, spłonął w noc wigilijną 1734 roku. Filip V zlecił budowę nowego pałacu, który zaprojektował Filippo Juvarra, a po jego śmierci dzieło dokończył Giovanni Battista Sacchetti. Prace trwały do połowy XVIII wieku, a Karol III wprowadził się tu w 1764 roku. Pałac ma ponad 135 tysięcy metrów kwadratowych i ponad 3 000 pomieszczeń, co czyni go jednym z największych w Europie. Dziś służy do uroczystości państwowych, a rodzina królewska mieszka poza centrum, w pałacu Zarzuela.",
"<strong>Schody i sala tronowa.</strong> Zwiedzanie zaczyna Wielka Klatka Schodowa z marmuru, która robi wrażenie rozmachem. Sala Tronowa jest ozdobiona freskiem Giambattisty Tiepola, przedstawiającym wielkość monarchii hiszpańskiej, oraz ogromnymi lustrami i czerwonym aksamitem. Tron wciąż pamięta ceremonie dworskie, a wokół stoją rzeźbione lwy.",
"<strong>Wnętrza.</strong> Na trasie są Sala Gasparini z wyszukanymi sztukateriami i jedwabiem, Sala Porcelany wyłożona płytkami z królewskiej manufaktury oraz Sala Kolumn używana do uroczystości. Wnętrza pełne są zegarów, gobelinów i mebli, a na suficiach malowali m.in. Mengs i Tiepolo.",
"<strong>Zbrojownia i apteka.</strong> Królewska Zbrojownia pokazuje zbroje i bronie, także z czasów Karola V. Zachowała się też Królewska Apteka, a pałac posiada instrumenty smyczkowe Stradivariusa, których dźwięk bywa wykorzystywany podczas koncertów.",
"<strong>Galeria Królewskich Kolekcji.</strong> W planie masz ją razem z pałacem. To nowoczesne muzeum przy placu Armería, gdzie pokazują skarby zgromadzone przez monarchów: obrazy, meble, tkaniny i przedmioty codzienne, które pomagają zrozumieć dzieje dworu. Zwiedzanie warto zaczynać od niej, jeśli jesteś zmęczony, bo jest chłodniejsza i spokojniejsza niż pałac.",
"<strong>Praktyka.</strong> Zaplanuj około dwóch godzin. W środku zwykle obowiązuje zakaz robienia zdjęć, a przy wejściu jest kontrola bezpieczeństwa i depozyt na duże plecaki. Kup bilet online, bo kolejki bywają długie. W wybrane dni miesiąca odbywa się uroczysta zmiana warty, więc sprawdź kalendarz na stronie pałacu. Po zwiedzaniu przespaceruj się do pobliskiego Plaza de Oriente."],
"Museo Nacional Centro de Arte Reina Sofía Madrid":[
"<strong>Budynek.</strong> Muzeum mieści się w dawnym Szpitalu Generalnym św. Karola, którego budowę zlecił w XVIII wieku Karol III, a projekt przygotował Francesco Sabatini. Szpital służył przez stulecia, a później przekształcono go w centrum sztuki, które od lat 90. XX wieku ma status muzeum narodowego. Do starego gmachu dobudowano nowoczesne skrzydło Jeana Nouvela, z charakterystycznym czerwonym dachem, a po fasadzie jeżdżą szklane windy.",
"<strong>Guernica.</strong> Najważniejsze dzieło to Guernica Pabla Picassa, namalowana w 1937 roku na pawilon Hiszpanii na wystawie w Paryżu. To monumentalny, czarno-biały obraz o bombardowaniu baskijskiego miasteczka podczas hiszpanńskiej wojny domowej. Płótno ma około 3,5 na 7,8 metra. Picasso zastrzegł, że obraz trafi do Hiszpanii dopiero wtedy, gdy wróci demokracja, więc przyjechał w 1981 roku, a w Reina Sofía wisi od 1992. Obok znajdziesz szkice i studia, które pomagają zrozumieć, jak rodził się obraz. Zwykle jest to sala 206 na drugim piętrze.",
"<strong>Surrealiści i kubiści.</strong> Zobacz Salvadora Dalí, m.in. Wielkiego masturbatora z 1929 roku i Dziewczynę w oknie. Są też prace Joana Miró, Juana Gris i innych twórców kubizmu oraz awangardy. Nie zapomnij o sali z plakatami i dokumentami z czasów wojny domowej.",
"<strong>Sztuka powojenna.</strong> Kolekcja obejmuje twórców takich jak Antoni Tàpies czy Eduardo Chillida, a także sztukę współczesną i fotografię. Ekspozycje zmieniają się, dlatego sprawdź plan muzeum przy wejściu.",
"<strong>Jak zwiedzać.</strong> Plan przewiduje cztery godziny, od 10:00 do 14:00, co pozwoli spokojnie obejrzeć najważniejsze działy i zrobić przerwę. Zacznij od Guernicy, zanim zrobi się tłoczno, a potem idź według pięter. W sali z Guernicą nie wolno fotografować. W muzeum jest kawiarnia przy dziedzińcu Nouvela, szatnia i szafki. Muzeum jest zamknięte we wtorki, a w wybrane wieczory bywa bezpłatné, więc sprawdź godziny. O 14:00 masz zaplanowane Prado, dlatego wyjdź z zapasem 10–15 minut."],
"Catedral de Toledo":[
"<strong>Historia.</strong> Budowę rozpoczęto w 1226 roku za panowania Ferdynanda III, z udziałem arcybiskupa Rodriga Jiméneza de Rady. Katedra stanęła na miejscu dawnego meczetu, a wcześniej wizygockiego kościoła. Wzorowano się na francuskiej architekturze gotyckiej, a prace ukończono dopiero w 1493 roku, więc budowla łączy różne style. Toledo było centrum Kościoła w Hiszpanii, a arcybiskup Toledo nosi tytuł prymasa Hiszpanii.",
"<strong>Wnętrze.</strong> Pięć naw wypełnia światło, które wpada przez witraże z XV i XVI wieku. Wysoki, złocony ołtarz główny pokrywają sceny z życia Chrystusa, a chór zdobią misternie rzeźbione stalle. Na niższych stallach przedstawiono zdobycie Granady, a górne wykonali Alonso Berruguete i Felipe Vigarny.",
"<strong>Transparente.</strong> Za ołtarzem znajdziesz barokowy Transparente z XVIII wieku, dzieło Narcisa Tomé. W sklepieniu wycięto otwór, przez który słońce oświetla marmurowe rzeźby. Dla wielu zwiedzających to najbardziej niezwykły fragment katedry, bo kontrastuje z surowym gotykiem.",
"<strong>Skarbiec i zakrystia.</strong> W skarbcu stoi złota monstrancja Enrique de Arfe z początku XVI wieku, którą w uroczystym pochodzie wynosi się w święto Bożego Ciała. Zakrystia to małe muzeum, w którym wiszą obrazy El Greca, m.in. Rozebranie Chrystusa, a także dzieła Goi i innych mistrzów.",
"<strong>Kaplice.</strong> Zobacz Kaplicę Mozarabską, w której wciąż sprawuje się dawny obrządek, oraz salę kapitulną z bogato zdobionym drewnianym sufitem. Każda kaplica ma własną historię i grobowce możnych rodzin.",
"<strong>Praktyka.</strong> Zaplanuj półtorej do dwóch godzin, według planu od 10:00 do 18:30. W kościele obowiązuje zasada skromnego ubioru, czyli zakryte ramiona i kolana. Weź audioprzewodnik, bo bez niego łatwo przeoczyć szczegóły. Po wyjściu możesz zjeść obiad w okolicy Zocodover."]};
async function open(s){
 const [ic,ct]=cat(s),isH=s.q==H,[czas,op,tip]=DET[s.q]||FB[ic]||[],ll=LL[s.q];
 const sec=(t,v)=>v?`<div class="sec"><b>${t}</b>${v}</div>`:"";
 const map=ll?`https://www.openstreetmap.org/export/embed.html?bbox=${ll[1]-.006},${ll[0]-.004},${ll[1]+.006},${ll[0]+.004}&layer=mapnik&marker=${ll[0]},${ll[1]}`:`https://www.google.com/maps?q=${enc(s.q)}&output=embed`;
